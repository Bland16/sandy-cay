<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandy Cay — the entry screen (treatment A, refined)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Sandy Cay — the entry screen. Treatment A ("the chart table"), refined.
   MOCKUP ONLY, not wired. Open from disk; sprite paths are relative to design/.

   ── The rules this is built against, and where they come from ──────────────
   Not generic design advice; the project's own, quoted so they can be checked.

   1. FRONTEND-SPEC §1, "function is color": "color is applied only where the
      user acts... Everything ambient — backgrounds, chrome, frames, icons at
      rest — stays ink-and-paper." So the table is NEAR-MONOCHROME and the only
      saturated thing on screen is the primary door. The first draft had a warm
      brown table competing with it; that was the biggest thing wrong with it.
   2. FRONTEND-SPEC §Motion: "a static film-grain overlay at 3% opacity sits
      above backgrounds only, never over text; NO FLICKER EFFECTS, EVER
      (photosensitivity)." A flickering lamp was the obvious move and it is
      forbidden. Every animation here is slow, smooth and monotonic — parallax,
      drift, a lamp that sways. Nothing strobes. The grain does not animate and
      it sits BELOW the chart, so it never falls over text.
   3. SPEC §10 motion vocabulary: hover lift 150ms, fades 120ms, iris wipe
      220ms, cubic-bezier(.4,0,.2,1). Reused rather than invented.
   4. P-1: coral/--warning is for scheduling PHYSICS only. The X on the chart is
      ink, not red, however tempting a red X is.
   5. SPEC §Accessibility: AA contrast, meaning never by colour alone, sprites
      decorative and aria-hidden, real buttons, visible focus.
   6. prefers-reduced-motion: all motion off, grain removed, lines drawn clean
      (FRONTEND-SPEC line language: the hand-wobble filter is motion-adjacent).

   ── One deliberate deviation, flagged rather than smuggled ─────────────────
   A wood table is warm, and rule 1 says ambient stays ink-and-paper. The
   precedent for a warm full-page ROOM is the Cabana (--cab-* exists for exactly
   that). This is treated as another room — but the warmth is pulled right down
   toward ink so the gold door still reads as the only colour on screen. If that
   is the wrong call, desaturating the three --tbl-* values is the whole fix.
   ═══════════════════════════════════════════════════════════════════════════ */

:root{
  /* real tokens, from src/ui/styles.css */
  --paper:#F1E9D8; --paper-shade:#E7DCC6; --ink:#2A2620; --ink-soft:#6E665A; --film:#141210;
  --hair:#D2C6A9;
  --primary:#2E8C99; --pinned:#C9A96E; --warning:#E2685F; --cta:#E8B94D;
  --cab-accent:#FFD166;
  --font-display:'Rye','Playfair Display',Georgia,serif;
  --font-type:'Special Elite','Courier New',monospace;
  --font-body:'Nunito',system-ui,sans-serif;

  /* the table: warmth pulled DOWN toward ink, per the deviation note above */
  --tbl-hi:#33302a; --tbl-mid:#22201c; --tbl-lo:#141311;

  /* 4px spacing scale — one rhythm, no ad-hoc numbers */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--tbl-lo);color:var(--ink);font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
/* Pixel art at ~60-100px native. Smoothing turns it to mush — the standing
   "art turns to mud" note is about ELEVEN pixels; crisp upscaling is the
   opposite case, and is the only reason these can be used here at all. */
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

.screen{
  position:relative;min-height:100svh;overflow:hidden;
  display:grid;place-items:center;padding:var(--s5) var(--s4);
}

/* ── the table, in depth layers ─────────────────────────────────────────────
   Parallax moves these by DIFFERENT amounts, which is what makes a flat page
   read as a surface with a light hanging over it. */
.layer{position:absolute;inset:-6%;pointer-events:none;will-change:transform}

.wood{
  background:linear-gradient(180deg,var(--tbl-hi) 0%,var(--tbl-mid) 52%,var(--tbl-lo) 100%);
}
/* plank seams + grain, drawn rather than photographed */
.wood::after{
  content:"";position:absolute;inset:0;opacity:.55;
  background:
    repeating-linear-gradient(90deg,transparent 0 118px,rgba(0,0,0,.55) 118px 121px),
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px);
}
.grainwood{opacity:.16;mix-blend-mode:overlay}

/* The lamp. It SWAYS — slow, smooth, monotonic. It does not flicker. */
.lamp{
  background:radial-gradient(46% 40% at 50% 42%,rgba(255,214,140,.26),rgba(255,201,120,.10) 42%,transparent 72%);
  animation:sway 26s ease-in-out infinite;
}
@keyframes sway{
  0%,100%{transform:translate3d(-14px,-6px,0) scale(1.00)}
  50%    {transform:translate3d( 14px, 8px,0) scale(1.045)}
}

/* Dust in the lamp light. Slow rise, one gentle fade per cycle — a mote that
   appears and disappears over fifteen seconds is drift, not a flicker. */
.motes{inset:0}
.mote{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:rgba(255,228,175,.85);filter:blur(.4px);opacity:0;
  animation:rise linear infinite;
}
@keyframes rise{
  0%  {transform:translateY(0) translateX(0);opacity:0}
  18% {opacity:.55}
  76% {opacity:.35}
  100%{transform:translateY(-190px) translateX(26px);opacity:0}
}

.vignette{background:radial-gradient(78% 70% at 50% 46%,transparent 42%,rgba(0,0,0,.62) 100%)}

/* STATIC grain, 3%, above the background and BELOW the chart — never over text.
   Removed entirely under reduced motion, per spec. */
.grain{opacity:.03;mix-blend-mode:overlay}

/* ── the chart ──────────────────────────────────────────────────────────────
   ⚠️ THE PAPER IS FILTERED. THE WORDS ARE NOT. This is a two-layer split and
   it is the whole reason the text is readable.

   The first version put `filter:url(#deckle)` on .chart itself. An SVG filter
   applies to an element AND ALL ITS DESCENDANTS, so the displacement map that
   was meant to tear the paper's edge was also running over every glyph, every
   button border and the title — smearing the type and giving the buttons torn
   edges nobody asked for. It looked like a font problem and was not.

   So: .parchment is a decorative sibling that carries the background, the
   shadow, the foxing, the coastline and the compass, and takes the filter.
   .content sits above it, unfiltered, crisp. */
.chart{
  position:relative;z-index:2;
  width:min(580px,100%);
  transform:rotate(-.45deg);
  animation:iris 220ms cubic-bezier(.4,0,.2,1) both;
}
.parchment{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(88% 74% at 28% 18%,#F8F1E3 0%,var(--paper) 46%,#E2D5B8 100%);
  box-shadow:0 34px 80px rgba(0,0,0,.66),
             inset 0 2px 0 rgba(255,255,255,.25),
             inset 0 0 70px rgba(150,120,70,.20);
  filter:url(#deckle);
}
.content{position:relative;z-index:1;padding:var(--s7) var(--s6) var(--s5);color:var(--ink)}

/* The app's own modal-open motion (iris wipe, 220ms), not a new one. */
@keyframes iris{
  from{clip-path:circle(0% at 50% 46%);opacity:0}
  to  {clip-path:circle(150% at 50% 46%);opacity:1}
}
/* foxing — age spots, so the parchment is not a flat cream rectangle */
.parchment::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
    radial-gradient(10px 7px at 11% 84%,rgba(140,100,50,.30),transparent 70%),
    radial-gradient(15px 9px at 86% 17%,rgba(140,100,50,.22),transparent 70%),
    radial-gradient(8px 6px at 70% 92%,rgba(140,100,50,.26),transparent 70%),
    radial-gradient(12px 8px at 22% 10%,rgba(140,100,50,.18),transparent 70%);
}
/* Both live INSIDE .parchment now. Previously they were positioned children of
   .chart while the doors were static flow — and a positioned element paints
   above a static one, so the coastline was drawing dashes straight across the
   guest button and the compass sat on top of the small print. */
.coast{position:absolute;inset:0;opacity:.14;pointer-events:none}
.rose{position:absolute;right:var(--s4);bottom:var(--s3);width:92px;opacity:.42;transform:rotate(8deg)}

/* the gull perches ON the paper, feet on the top edge */
.gull{
  position:absolute;top:-54px;right:56px;width:66px;
  animation:bob 5.2s ease-in-out infinite;transform-origin:50% 100%;
  filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));
}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%    {transform:translateY(-6px) rotate(1.5deg)}
}

.brand{text-align:center;position:relative}
.brand h1{
  font-family:var(--font-display);font-weight:400;margin:0;
  font-size:clamp(40px,7.6vw,60px);line-height:.98;color:#241c14;
  text-shadow:0 1px 0 rgba(255,255,255,.55);
}
.rule{display:flex;align-items:center;gap:var(--s3);margin:var(--s3) auto 0;max-width:340px;color:#9b8e71}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:currentColor;opacity:.6}
/* Special Elite EARNS its place here: four tracked-out uppercase words, which
   is exactly the label job styles.css uses it for. Darkened from #7c7159,
   which measured 3.98 and missed AA for text this size. */
.rule span{
  font-family:var(--font-type);font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;white-space:nowrap;color:#665C46;
}

/* ── the two doors ─────────────────────────────────────────────────────────
   Same height, same weight, same target size. The gold marks the RECOMMENDED
   one, never a diminished alternative — a guest is a real way to use this. And
   colour is not doing that work alone (§10): the words and the sprite say it. */
.doors{display:grid;gap:var(--s3);margin-top:var(--s6)}
/* ⚠️ SAME TWO-LAYER RULE AS THE PAPER, and for the same reason.
   The scratchy edge is wanted — it is the spec's line language and it carries
   the mood. What is NOT wanted is that scratch running over the label. So the
   button's SURFACE (border, fill, drop shadow) is a filtered ::before, and the
   sprite and words sit above it, crisp.
   Texture on the surface, never on the type. */
.door{
  position:relative;isolation:isolate;
  display:flex;align-items:center;gap:var(--s4);width:100%;text-align:left;
  min-height:56px;                       /* comfortably past the 44px target */
  padding:var(--s3) var(--s4);cursor:pointer;font-family:var(--font-body);
  border:0;background:none;              /* both moved to ::before */
  transition:transform 150ms cubic-bezier(.4,0,.2,1);
}
.door::before{
  content:"";position:absolute;inset:0;z-index:0;
  border:2px solid var(--ink);border-radius:14px;   /* rubber-hose corners */
  background:var(--paper-shade);
  box-shadow:0 4px 0 rgba(42,38,32,.9);
  filter:url(#scratch);
  transition:box-shadow 150ms cubic-bezier(.4,0,.2,1);
}
/* An absolutely-positioned ::before paints ABOVE in-flow inline content, so the
   label needs to be lifted explicitly or the surface covers it. */
.door > *{position:relative;z-index:1}
.door:hover{transform:translateY(-2px)}
.door:hover::before{box-shadow:0 6px 0 rgba(42,38,32,.9)}
.door:active{transform:translateY(3px)}
.door:active::before{box-shadow:0 1px 0 rgba(42,38,32,.9)}
/* The focus ring stays CRISP and unscratched — it is an accessibility affordance
   and legibility beats mood there, every time. */
.door:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:14px}
.door img{width:44px;flex:none}
/* The TITLE keeps Rye — it is a heading, three or four words, and the display
   face is doing what a display face is for. */
.door .t{font-family:var(--font-display);font-size:17.5px;line-height:1.12;color:#241c14;display:block}
/* ⚠️ The EXPLANATION is body copy, so it is set in the body face.
   It was Special Elite — a distressed typewriter face whose whole character is
   broken, uneven strokes. That is charm on a three-word label and a tax on a
   two-line sentence, especially at 11px. Nunito at 13/1.5 is the same family
   the app already uses for every button and description (styles.css uses
   --font-type only for short labels: hour marks, tags, 8-9px captions).
   Contrast was never the problem — it measured 4.88 and 5.25, both AA — so the
   colours only tighten a little rather than change. */
.door .s{
  font-family:var(--font-body);font-size:13px;font-weight:600;line-height:1.5;
  color:#4A4335;margin-top:var(--s1);display:block;max-width:42ch;
}
/* the fill lives on the surface layer now, not the button */
.door.primary::before{background:var(--cta);border-color:#6f5312}
.door.primary .t{color:#33270a}
.door.primary .s{color:#4A3809}          /* 6.2:1 on the gold */

/* The small print goes BACK to the typewriter — two short centred lines is
   label-length, which is where Special Elite belongs, and it is a good part of
   the mood. It is the two-line EXPLANATION inside each door that stays in the
   body face; that one is a real sentence and is where the face was costing
   legibility. Set at 12px rather than the original 10.5, which is most of why
   it was hard to read. */
.smallprint{
  margin:var(--s5) 0 0;font-family:var(--font-type);font-size:12px;
  line-height:1.7;letter-spacing:.015em;color:#544C3D;text-align:center;
}
.smallprint b{color:#7A3128;font-weight:400}   /* a warning WORD, not P-1 coral */

/* ── responsive: this has to work on the phone it exists to sign in on ──── */
@media (max-width:600px){
  /* padding lives on .content now that the paper is its own layer — setting it
     on .chart here would have quietly kept the desktop padding on a phone */
  .content{padding:var(--s6) var(--s4) var(--s5)}
  .chart{transform:none}
  .gull{right:18px;top:-46px;width:56px}
  .rose{width:70px;opacity:.34}
  .door{gap:var(--s3)}
  .door img{width:38px}
  .door .t{font-size:16px}
}
@media (max-height:600px){ .gull{display:none} }

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  .grain{display:none}                    /* spec: grain removed */
  /* spec: "prefers-reduced-motion gets clean lines" — that is the line language
     talking about the hand-wobble, so every irregular outline goes straight. */
  .coast, .door::before{filter:none}
  .chart{clip-path:none;opacity:1}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- torn parchment edge: displace the card's own alpha so the rectangle
       stops being a rectangle. Cheap, and it sells "chart" over "div". -->
  <filter id="deckle">
    <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- hand-wobble for the drawn coastline (FRONTEND-SPEC line language) -->
  <filter id="wobble">
    <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="4" result="w"/>
    <feDisplacementMap in="SourceGraphic" in2="w" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- The button outline's scratch. FRONTEND-SPEC asks for "2px --ink outlines,
       slightly irregular (SVG with subtle hand-wobble filter)" — so this is the
       house line language, not decoration.
       HIGH frequency, LOW scale is the difference between scratchy and melted:
       fine noise nibbles the edge, a big displacement would make it wobble like
       a flag. Applied to the button's SURFACE layer only, never its label. -->
  <filter id="scratch">
    <feTurbulence type="fractalNoise" baseFrequency="0.075" numOctaves="3" seed="9" result="s"/>
    <feDisplacementMap in="SourceGraphic" in2="s" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="filmgrain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</svg>

<section class="screen">
  <!-- depth layers, back to front. data-depth drives the parallax. -->
  <div class="layer wood" data-depth="6"></div>
  <svg class="layer grainwood" data-depth="6" aria-hidden="true"><rect width="100%" height="100%" filter="url(#filmgrain)"/></svg>
  <div class="layer lamp" data-depth="16"></div>
  <div class="layer motes" id="motes" data-depth="26"></div>
  <div class="layer vignette" data-depth="0"></div>
  <svg class="layer grain" data-depth="0" aria-hidden="true"><rect width="100%" height="100%" filter="url(#filmgrain)"/></svg>

  <div class="chart">
    <!-- Decorative layer. Everything in here is filtered and inert; nothing in
         here is text. See the .parchment note in the stylesheet. -->
    <div class="parchment" aria-hidden="true">
      <svg class="coast" viewBox="0 0 580 400" preserveAspectRatio="none" filter="url(#wobble)">
        <path d="M20,306 C96,274 128,326 198,302 C258,281 276,238 340,246 C412,256 436,306 522,286"
              fill="none" stroke="#3d2f1c" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
        <path d="M58,352 C142,332 206,364 276,340 C352,314 414,354 540,328"
              fill="none" stroke="#3d2f1c" stroke-width="1.5" stroke-dasharray="1 9" stroke-linecap="round"/>
        <!-- INK, not coral: P-1 reserves --warning for scheduling physics. -->
        <circle cx="340" cy="246" r="8" fill="none" stroke="#2A2620" stroke-width="2.5"/>
        <path d="M332,238 L348,254 M348,238 L332,254" stroke="#2A2620" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <img class="px rose" src="../src/assets/icons/compass.png" alt="">
    </div>

    <!-- The gull sits outside .parchment so it stays crisp: it is pixel art,
         and a displacement map is exactly what pixel art must not go through. -->
    <img class="px gull" src="../src/assets/icons/seagull.png" alt="" aria-hidden="true">

    <div class="content">
    <div class="brand">
      <h1>Sandy&nbsp;Cay</h1>
      <div class="rule"><span>make yer landing</span></div>
    </div>

    <div class="doors">
      <button class="door primary" type="button">
        <img class="px" src="../src/assets/icons/treasure-chest.png" alt="" aria-hidden="true">
        <span>
          <span class="t">Bury it in the chest</span>
          <span class="s">Launches a Google Calendar API to log in to your
            current schedule</span>
        </span>
      </button>

      <button class="door" type="button">
        <img class="px" src="../src/assets/icons/message-bottle.png" alt="" aria-hidden="true">
        <span>
          <span class="t">Sail without a flag</span>
        </span>
      </button>
    </div>

    <p class="smallprint">
      A guest&rsquo;s week is kept in this browser alone.<br>
      <b>Export before you close the tab</b>, or the tide takes it.
    </p>
    </div><!-- /.content -->
  </div>
</section>

<script>
// Motion is opt-out at the SOURCE, not only in CSS: if the user asked for less
// motion we never start the loops at all.
var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Dust motes. Positions vary so the field never reads as a pattern.
if (!still) {
  var host = document.getElementById('motes');
  for (var i = 0; i < 16; i++) {
    var m = document.createElement('span');
    m.className = 'mote';
    m.style.left = (8 + Math.random() * 84) + '%';
    m.style.top = (48 + Math.random() * 46) + '%';
    m.style.animationDuration = (11 + Math.random() * 12) + 's';
    m.style.animationDelay = (-Math.random() * 18) + 's';
    host.appendChild(m);
  }
}

// Parallax. Layers move by different amounts, so the table reads as a surface
// under a light rather than a flat backdrop. Pointer only — no device tilt,
// which is a motion-sickness trap on a phone.
if (!still && window.matchMedia('(pointer: fine)').matches) {
  var layers = [].slice.call(document.querySelectorAll('.layer[data-depth]'));
  var tx = 0, ty = 0, cx = 0, cy = 0, raf = null;
  function frame() {
    cx += (tx - cx) * 0.06;
    cy += (ty - cy) * 0.06;
    for (var j = 0; j < layers.length; j++) {
      var el = layers[j];
      var d = parseFloat(el.getAttribute('data-depth')) || 0;
      // The lamp keeps its own sway keyframe; writing transform here would
      // overwrite it, so the lamp is simply left to sway on its own.
      if (!d || el.classList.contains('lamp')) continue;
      el.style.transform = 'translate3d(' + (cx * d).toFixed(2) + 'px,' + (cy * d).toFixed(2) + 'px,0)';
    }
    raf = (Math.abs(tx - cx) > 0.01 || Math.abs(ty - cy) > 0.01) ? requestAnimationFrame(frame) : null;
  }
  window.addEventListener('pointermove', function (e) {
    tx = (e.clientX / window.innerWidth - 0.5) * 2;
    ty = (e.clientY / window.innerHeight - 0.5) * 2;
    if (!raf) raf = requestAnimationFrame(frame);
  }, { passive: true });
}
</script>
</body>
</html>
